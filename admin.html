<!-- admin-login.html -->
<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دخول المسؤولين</title>
    <link rel="stylesheet" href="./css/user.css" />
  </head>
  <body>
    <div class="login-container">
      <h2>دخول المسؤولين</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label for="admin-username">اسم المستخدم</label>
          <input
            type="text"
            id="admin-username"
            name="admin-username"
            required
          />
        </div>
        <div class="form-group">
          <label for="admin-password">كلمة المرور</label>
          <input
            type="password"
            id="admin-password"
            name="admin-password"
            required
          />
        </div>
        <button type="submit" id="admin-login-btn">تسجيل الدخول</button>
      </form>

      <p id="admin-error-message" style="color: red"></p>
      <p><a href="index.html">الرجوع لتسجيل دخول المستخدمين</a></p>
    </div>

    <script src="./js/admin.js"></script>
    <script>
      // ./js/admin.js

      document
        .getElementById("admin-login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault(); // منع إرسال النموذج بشكل افتراضي

          const username = document
            .getElementById("admin-username")
            .value.trim();
          const password = document
            .getElementById("admin-password")
            .value.trim();
          const errorMessage = document.getElementById("admin-error-message");

          // تحقق من اسم المستخدم وكلمة المرور
          if (username === "admin" && password === "123456") {
            // لو البيانات صحيحة، نوجهه لصفحة لوحة التحكم أو أي صفحة تانية
            window.location.href = "admin-dashboard.html";
          } else {
            // لو البيانات خطأ
            errorMessage.textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
          }
        });
    </script>
  </body>
</html>
