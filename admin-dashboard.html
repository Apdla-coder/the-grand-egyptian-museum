<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة تحكم المسؤول</title>
    <style>
      /* الخط العام والصفحة */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f9fafb;
        padding: 30px 15px;
        direction: rtl;
        text-align: center;
        color: #333;
        min-height: 100vh;
      }

      /* زرار تعديل القطع الأثرية */
      a button {
        background: linear-gradient(135deg, #4a90e2, #357abd);
        border: none;
        color: white;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(53, 122, 189, 0.4);
        transition: background 0.3s ease, box-shadow 0.3s ease;
        margin-bottom: 25px;
      }
      a button:hover {
        background: linear-gradient(135deg, #357abd, #4a90e2);
        box-shadow: 0 6px 12px rgba(53, 122, 189, 0.6);
      }

      /* عنوان الجدول */
      h2 {
        color: #222;
        margin-bottom: 15px;
        font-weight: 700;
        font-size: 24px;
        user-select: none;
      }

      /* تصميم الجدول */
      table {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto 40px auto;
        border-collapse: separate;
        border-spacing: 0;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        font-size: 16px;
      }

      /* رؤوس الجدول */
      thead tr {
        background: #004080;
        color: #f9d342;
        text-align: center;
        font-weight: 600;
      }

      /* خلايا الجدول */
      th,
      td {
        padding: 14px 18px;
        border-bottom: 1px solid #e1e4e8;
        text-align: center;
        vertical-align: middle;
      }

      /* الصف الأخير بدون خط تحت */
      tbody tr:last-child td {
        border-bottom: none;
      }

      /* تأثير تظليل الصف عند المرور */
      tbody tr:hover {
        background-color: #f0f5ff;
      }

      /* رسالة لا توجد حجوزات */
      tbody tr td[colspan="7"] {
        font-style: italic;
        color: #888;
        padding: 30px 0;
      }

      /* لجعل الجدول متجاوب على الشاشات الصغيرة */
      @media (max-width: 700px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
          width: 100%;
        }

        thead tr {
          display: none;
        }

        tbody tr {
          margin-bottom: 20px;
          background: #fff;
          border-radius: 10px;
          box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
          padding: 15px;
        }

        tbody td {
          text-align: right;
          padding-left: 50%;
          position: relative;
          border: none;
          border-bottom: 1px solid #eee;
        }

        tbody td::before {
          position: absolute;
          right: 15px;
          top: 14px;
          white-space: nowrap;
          font-weight: 600;
          color: #004080;
        }

        tbody td:nth-of-type(1)::before {
          content: "الاسم";
        }
        tbody td:nth-of-type(2)::before {
          content: "البريد الإلكتروني";
        }
        tbody td:nth-of-type(3)::before {
          content: "رقم الهاتف";
        }
        tbody td:nth-of-type(4)::before {
          content: "تاريخ الزيارة";
        }
        tbody td:nth-of-type(5)::before {
          content: "نوع التذكرة";
        }
        tbody td:nth-of-type(6)::before {
          content: "العدد";
        }
        tbody td:nth-of-type(7)::before {
          content: "رقم الحجز";
        }
      }
    </style>
  </head>
  <body>
    <a href="uniq-dashboard.html">
      <button>🛠️ تعديل القطع الأثرية</button>
    </a>

    <h2>📋 جدول حجوزات الزوار</h2>
    <table>
      <thead>
        <tr>
          <th>الاسم</th>
          <th>البريد الإلكتروني</th>
          <th>رقم الهاتف</th>
          <th>تاريخ الزيارة</th>
          <th>نوع التذكرة</th>
          <th>العدد</th>
          <th>رقم الحجز</th>
        </tr>
      </thead>
      <tbody id="bookingTableBody">
        <!-- هنا هتضاف الصفوف تلقائيًا -->
      </tbody>
    </table>

    <script>
      const bookings = JSON.parse(localStorage.getItem("allBookings")) || [];

      const tableBody = document.getElementById("bookingTableBody");

      if (bookings.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="7">لا توجد حجوزات</td></tr>';
      } else {
        bookings.forEach((booking) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${booking.name}</td>
            <td>${booking.email}</td>
            <td>${booking.phone}</td>
            <td>${booking.date}</td>
            <td>${booking.ticketType}</td>
            <td>${booking.quantity}</td>
            <td>${booking.bookingNumber}</td>
          `;
          tableBody.appendChild(row);
        });
      }
    </script>
  </body>
</html>
